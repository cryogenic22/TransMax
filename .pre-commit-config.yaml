# TransMax pre-commit hooks — bootstrapped from kp-sdlc/harness on 2026-05-01.
#
# Adapted for transmax: quality-gate is at repo root (not tools/qa/),
# Python toolchain is pip + ruff + black + mypy (not uv), no cathedral-keeper yet.
#
# Install:   pre-commit install --hook-type pre-commit --hook-type prepare-commit-msg
# Run all:   pre-commit run --all-files

default_language_version:
  python: python3.11

# Repo-wide exclude. Vendored upstream tools and product docs are untouched
# unless a hook re-includes them via its own `files:` pattern.
exclude: ^(quality-gate/|frontend/node_modules/|.*\.lock$|.*\.db$|.*/__pycache__/)

repos:
  # ── Hygiene ────────────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude_types: [markdown]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: detect-private-key
      - id: mixed-line-ending
        args: ["--fix=lf"]

  # ── Python lint + format ──────────────────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        files: ^(app|scripts|tests)/.*\.py$
      - id: ruff-format
        files: ^(app|scripts|tests)/.*\.py$

  # ── Secret scanning ───────────────────────────────────────────────────
  # gitleaks catches what detect-private-key misses (API keys, tokens, etc.)
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # ── KP_SDLC Quality Gate (vendored locally at quality-gate/) ──────────
  # PRS scoring + AI/LLM/Prompt/FastAPI/Security packs.
  - repo: local
    hooks:
      - id: quality-gate
        name: Quality Gate (PRS >= 85)
        entry: python quality-gate/quality_gate.py --staged
        language: system
        files: \.(py|ts|tsx|js|jsx)$
        exclude: ^(quality-gate/|frontend/node_modules/|alembic/versions/)
        pass_filenames: false
        stages: [pre-commit]

  # ── Ratchet (transmax-specific monotonic improvement) ─────────────────
  - repo: local
    hooks:
      - id: ratchet-check
        name: Ratchet (monotonic-improvement check)
        entry: python scripts/ratchet.py check
        language: system
        pass_filenames: false
        stages: [pre-commit]

  # ── Worksheet/commit drift audit (advisory) ───────────────────────────
  # Runs `scripts/audit_worksheet_drift.py` so a developer sees drift
  # before push. Advisory only — `verbose: true` surfaces output, but
  # `|| true` keeps a non-zero exit from blocking the commit. The CI
  # equivalent (TMX-3060) is what gates merges.
  - repo: local
    hooks:
      - id: drift-audit-advisory
        name: Worksheet/commit drift audit (advisory)
        entry: bash -c 'python scripts/audit_worksheet_drift.py || true'
        language: system
        pass_filenames: false
        files: ^\.context/loops/.*\.md$
        stages: [pre-commit]
        verbose: true

  # ── Worktree-vs-origin/main drift audit (advisory) ────────────────────
  # Sister to the worksheet drift audit. Catches the case where the
  # local working tree silently reverts shipped code (e.g. a re-introduced
  # DEFAULT_ORG_ID literal that TMX-3012d's test would catch). Advisory
  # only — surfaces findings via `verbose: true` but `|| true` keeps a
  # non-zero exit from blocking emergency commits. Spawned by
  # TMX-CORRECTIVE-20260511.
  - repo: local
    hooks:
      - id: worktree-clean-advisory
        name: Worktree-vs-origin/main drift audit (advisory)
        entry: bash -c 'python scripts/audit_worktree_clean.py || true'
        language: system
        pass_filenames: false
        files: ^(app|tests)/.*\.py$
        stages: [pre-commit]
        verbose: true

  # ── Red-flag attestation (kp-sdlc/harness) ────────────────────────────
  # Appends a Self-review skeleton to the commit message if missing.
  - repo: local
    hooks:
      - id: red-flag-attestation
        name: Red-flag attestation (kp-sdlc/harness)
        entry: bash .harness/hooks/red-flag-attestation.sh
        language: system
        stages: [prepare-commit-msg]
        always_run: true
        pass_filenames: true
