[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "transmax-sdk"
version = "0.1.0"
description = "TransMax Pharmaceutical Translation SDK"
readme = "README.md"
license = {text = "Proprietary"}
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "langdetect>=1.0.9",
    "tiktoken>=0.5.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "prometheus-client>=0.19.0",
]

[project.optional-dependencies]
llm = [
    "openai>=1.0",
    "anthropic>=0.20",
    "langchain>=0.1",
    "langchain-openai>=0.1",
]
mcp = [
    "mcp>=1.0",
]
all = [
    "transmax-sdk[llm,mcp]",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "ruff",
    "black",
    "mypy",
]

[tool.setuptools.packages.find]
include = ["transmax_sdk*", "transmax_mcp*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
