# Secret scanning — bootstrapped 2026-05-01 per v3.0 plan TMX-3008.
# Runs gitleaks on every PR + push to main, plus a daily scan of the full
# history to catch anything that bypassed pre-commit.
name: secret-scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Daily 04:00 UTC — scan the entire repo history.
    - cron: "0 4 * * *"

permissions:
  contents: read
  pull-requests: write
  security-events: write

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history when running on schedule; shallow for PR/push.
          fetch-depth: ${{ github.event_name == 'schedule' && 0 || 1 }}

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Allow the action to fail soft on PR comments while still failing the job;
          # on schedule, also produce a SARIF for code-scanning.
          GITLEAKS_NOTIFY_USER_LIST: "@kapilpant"

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
        continue-on-error: true
