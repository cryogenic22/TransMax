name: TransMax CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: transmax
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Initialise database schema
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/transmax
        APP_ENV: test
      run: |
        # Run init_db() to create every table from the model schema and seed
        # the default-org row. The C-06 mega-migration only creates 7 of the
        # 22 tenant-scoped tables; init_db()'s create_all picks up the rest
        # until TMX-3017 lands the per-table semantic revisions.
        python -c "from app.core.database import init_db; init_db()"

    - name: Run Tests
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/transmax
        APP_ENV: test
      run: |
        pytest tests/

  frontend-integration:
    name: Frontend ↔ Backend integration
    runs-on: ubuntu-latest
    needs: [test, frontend]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Set up Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: "npm"
        cache-dependency-path: frontend/package-lock.json

    - name: Install frontend dependencies
      working-directory: frontend
      run: npm ci

    - name: Install Playwright browsers
      working-directory: frontend
      run: npx playwright install --with-deps chromium

    - name: Run integration suite (live backend + live frontend)
      working-directory: frontend
      env:
        APP_ENV: test
        AUTH_MODE: none
        OPENAI_API_KEY: test-stub
      run: npm run e2e:integration

    - name: Upload integration playwright report on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report-integration
        path: frontend/playwright-report-integration
        retention-days: 7

  frontend:
    name: Frontend (lint + typecheck + build + test + e2e)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: "npm"
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Lint (max 185 warnings — TMX-3614 baseline)
      run: npm run lint

    - name: Typecheck
      run: npm run typecheck

    - name: Build
      run: npm run build

    - name: Vitest unit + component tests
      run: npm run test

    - name: Install Playwright browsers
      run: npx playwright install --with-deps chromium

    - name: Playwright e2e
      run: npm run e2e

    - name: Upload Playwright report on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: frontend/playwright-report
        retention-days: 7

  build-image:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Build Docker image
      run: docker build -t transmax-app:latest .
