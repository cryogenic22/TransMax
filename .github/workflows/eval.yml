# AI Eval Harness — bootstrapped from kp-sdlc/harness on 2026-05-01.
# Runs the deterministic-gate golden suites under tests/evals/.
# Live LLM-driven suites (full scope) are skipped unless the corresponding API
# keys are set; the harness-only scope runs unconditionally.
name: eval

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golden-suite:
    name: Golden eval suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Determine eval scope
        id: scope
        env:
          HAS_OPENAI: ${{ secrets.OPENAI_API_KEY != '' }}
          HAS_ANTHROPIC: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          if [ "$HAS_OPENAI" = "true" ] || [ "$HAS_ANTHROPIC" = "true" ]; then
            echo "scope=full" >> "$GITHUB_OUTPUT"
          else
            echo "scope=harness-only" >> "$GITHUB_OUTPUT"
          fi

      - name: Run eval suite
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m tests.evals.runner --scope ${{ steps.scope.outputs.scope }} --report-json eval_results/latest.json

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-${{ github.run_id }}
          path: eval_results/latest.json
          if-no-files-found: warn

      - name: Comment on PR with eval delta
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'eval_results/latest.json';
            if (!fs.existsSync(path)) {
              github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: '⚠️ Eval report missing — runner failed to produce `eval_results/latest.json`.'
              });
              return;
            }
            const r = JSON.parse(fs.readFileSync(path, 'utf8'));
            const denom = Math.max(1, r.total - (r.skipped || 0));
            const passRate = (100 * (r.passed || 0) / denom).toFixed(1);
            const lines = [
              '### Golden eval suite',
              '',
              `**Scope:** \`${r.scope}\``,
              `**Cases:** ${r.passed}/${r.total} passed (${r.skipped || 0} skipped, ${r.failed || 0} failed)`,
              `**Pass rate:** ${passRate}%`,
              '',
              r.failures && r.failures.length
                ? '<details><summary>Failures</summary>\n\n' +
                  r.failures.slice(0, 10).map(f => `- \`${f.id}\` — ${f.reason}`).join('\n') +
                  '\n\n</details>'
                : '✅ No failures.',
            ].join('\n');
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: lines
            });

  # TMX-MQM-EVAL-CI — judge-reliability gate. Structure tier (no keys) always
  # blocks a missing/empty/lopsided gold set; judge tier (keys present) blocks
  # below the recall floor.
  judge-gate:
    name: Judge-reliability gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Determine judge scope
        id: scope
        env:
          HAS_OPENAI: ${{ secrets.OPENAI_API_KEY != '' }}
          HAS_ANTHROPIC: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          if [ "$HAS_OPENAI" = "true" ] || [ "$HAS_ANTHROPIC" = "true" ]; then
            echo "require=--require-judge" >> "$GITHUB_OUTPUT"
          else
            echo "require=" >> "$GITHUB_OUTPUT"
          fi

      - name: Run judge-reliability gate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m scripts.judge_eval_gate check ${{ steps.scope.outputs.require }} --report-json eval_results/judge_gate.json

      - name: Upload judge-gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: judge-gate-report-${{ github.run_id }}
          path: eval_results/judge_gate.json
          if-no-files-found: warn
